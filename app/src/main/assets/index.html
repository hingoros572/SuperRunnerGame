
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#54c9ff">
<title>Super Monkey Runner</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #54c9ff;
  font-family: Arial, sans-serif;
}

#game {
  position: absolute;
  inset: 0;
  display: block;
  width: 100vw;
  height: 100%;
  border: 0;
  margin: 0;
  padding: 0;
  touch-action: manipulation;
}

#hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 5;
  padding: 5px 7px;
  background: linear-gradient(
    to bottom,
    rgba(8,22,39,.88),
    rgba(8,22,39,.55)
  );
  color: white;
}

.toprow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
}

h2 {
  margin: 0;
  font-size: clamp(12px, 3vw, 19px);
  font-weight: 900;
  white-space: nowrap;
  text-shadow: 2px 2px 3px #000;
}

.controls {
  display: flex;
  gap: 5px;
  align-items: center;
}

button {
  border: 2px solid rgba(255,255,255,.7);
  border-radius: 9px;
  padding: 8px 11px;
  min-width: 55px;
  background: #ffc928;
  color: #18202b;
  font-size: clamp(10px, 2.5vw, 14px);
  font-weight: 900;
  white-space: nowrap;
  touch-action: manipulation;
}

button:active {
  background: #ff941c;
  transform: scale(.94);
}

#info {
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 5px;
  margin-top: 5px;
  padding: 5px 3px;
  border-radius: 8px;
  background: rgba(0,0,0,.42);
  font-size: clamp(10px, 2.5vw, 14px);
  font-weight: bold;
  white-space: nowrap;
}

#message {
  position: absolute;
  z-index: 6;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  max-width: 90%;
  padding: 7px 13px;
  border-radius: 10px;
  background: rgba(0,0,0,.65);
  color: white;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  pointer-events: none;
}

@media (orientation: portrait) {
  h2 { font-size: 12px; }
  button { padding: 7px 8px; min-width: 45px; }
  #info { font-size: 10px; }
}
</style>
</head>

<body>

<canvas id="game" width="900" height="450"></canvas>

<div id="hud">
  <div class="toprow">
    <h2>🐵 SUPER MONKEY RUNNER</h2>

    <div class="controls">
      <button onclick="startGame()">▶ PLAY</button>
      <button onclick="togglePause()">⏸ PAUSE</button>
      <button onclick="jump()">⬆ JUMP</button>
    </div>
  </div>

  <div id="info">
    <span id="level">Level: 1/200</span>
    <span id="score">Score: 0</span>
    <span id="coins">Coins: 0</span>
    <span id="lives">❤️❤️❤️</span>
    <span id="timer">04:00</span>
  </div>
</div>

<div id="message">🐵 Welcome! Press PLAY to start!</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const runImage = new Image();
runImage.src = "monkey-run.png";
let runLoaded = false;
runImage.onload = () => {
  runLoaded = true;
  draw();
};

const stillImage = new Image();
stillImage.src = "monkey.png";
let stillLoaded = false;
stillImage.onload = () => {
  stillLoaded = true;
  draw();
};

let running = false;
let paused = false;
let gameOver = false;
let level = 1;
let score = 0;
let coins = 0;
let lives = 3;
let timeLeft = 240;
let lastTime = 0;
let animationTime = 0;
let spawnTimer = 0;
let coinTimer = 0;
let invulnerable = 0;
let obstacles = [];
let treasures = [];

const player = {
  x: 110, y: 300, w: 85, h: 95,
  vy: 0, ground: true
};

const groundY = 395;

function levelDuration(n) {
  if (n <= 50) return 240;
  if (n <= 100) return 300;
  if (n <= 150) return 360;
  return 480;
}

function difficulty() {
  if (level <= 50) return 1;
  if (level <= 100) return 1.3;
  if (level <= 150) return 1.6;
  return 1.9;
}

function formatTime(t) {
  let m = Math.floor(t / 60);
  let s = Math.floor(t % 60);
  return String(m).padStart(2, "0") + ":" +
         String(s).padStart(2, "0");
}

function updateInfo() {
  document.getElementById("level").textContent =
    "Level: " + level + "/200";
  document.getElementById("score").textContent =
    "Score: " + score;
  document.getElementById("coins").textContent =
    "Coins: " + coins;
  document.getElementById("lives").textContent =
    "❤️".repeat(lives) + "🖤".repeat(3-lives);
  document.getElementById("timer").textContent =
    formatTime(timeLeft);
}

function startGame() {
  level = 1;
  score = 0;
  coins = 0;
  lives = 3;
  timeLeft = levelDuration(level);
  obstacles = [];
  treasures = [];
  spawnTimer = 0;
  coinTimer = 0;
  invulnerable = 0;

  player.x = 110;
  player.y = groundY - player.h;
  player.vy = 0;
  player.ground = true;

  running = true;
  paused = false;
  gameOver = false;
  lastTime = 0;
  animationTime = 0;

  document.getElementById("message").textContent =
    "Run Monkey! Collect coins and bananas!";

  updateInfo();
  draw();
  requestAnimationFrame(loop);
}

function jump() {
  if (!running || paused || gameOver) return;

  if (player.ground) {
    player.vy = -15;
    player.ground = false;
  }
}

function togglePause() {
  if (!running || gameOver) return;

  paused = !paused;

  document.getElementById("message").textContent =
    paused ? "GAME PAUSED" : "KEEP RUNNING!";

  if (!paused) {
    lastTime = 0;
    requestAnimationFrame(loop);
  } else {
    draw();
  }
}

canvas.addEventListener("pointerdown", jump);

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});

function drawBackground() {
  let sky = ctx.createLinearGradient(0,0,0,450);
  sky.addColorStop(0,"#54c9ff");
  sky.addColorStop(1,"#d4f6ff");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,900,450);

  ctx.fillStyle = "#fff";
  drawCloud(150,75);
  drawCloud(430,110);
  drawCloud(730,65);

  ctx.fillStyle = "#ffd43b";
  ctx.beginPath();
  ctx.arc(790,90,40,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#60b85b";
  ctx.beginPath();
  ctx.moveTo(0,310);
  ctx.quadraticCurveTo(230,170,460,310);
  ctx.quadraticCurveTo(680,185,900,300);
  ctx.lineTo(900,450);
  ctx.lineTo(0,450);
  ctx.fill();

  ctx.fillStyle = "#4b963f";
  ctx.fillRect(0,groundY,900,55);

  ctx.fillStyle = "#77502e";
  ctx.fillRect(0,groundY+15,900,40);

  ctx.fillStyle = "#f6d88a";
  for(let x=0;x<900;x+=80) {
    ctx.fillRect(x,groundY+25,40,5);
  }
}

function drawCloud(x,y) {
  ctx.beginPath();
  ctx.arc(x,y,22,0,Math.PI*2);
  ctx.arc(x+25,y-12,28,0,Math.PI*2);
  ctx.arc(x+55,y,22,0,Math.PI*2);
  ctx.fill();
}

function drawMonkey() {
  if(invulnerable>0 &&
     Math.floor(animationTime/70)%2===0) return;

  if(runLoaded) {
    const fw=runImage.naturalWidth/4;
    const fh=runImage.naturalHeight;
    const frame=Math.floor(animationTime/110)%4;

    ctx.drawImage(runImage,frame*fw,0,fw,fh,
      player.x,player.y,player.w,player.h);
  } else if(stillLoaded) {
    ctx.drawImage(stillImage,
      player.x,player.y,player.w,player.h);
  } else {
    ctx.font="75px Arial";
    ctx.fillText("🐵",player.x,player.y+75);
  }
}

function drawHomeScreen() {
  drawBackground();

  // Bandar home screen ke beech mein
  const homeX = 405;
  const homeY = 225;

  if (stillLoaded) {
    ctx.drawImage(stillImage, homeX, homeY, 100, 115);
  } else if (runLoaded) {
    const fw = runImage.naturalWidth / 4;
    ctx.drawImage(runImage, 0, 0, fw, runImage.naturalHeight,
      homeX, homeY, 100, 115);
  } else {
    ctx.font = "95px Arial";
    ctx.fillText("🐵", homeX, homeY + 90);
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.strokeStyle = "#163b22";
  ctx.lineWidth = 5;
  ctx.font = "bold 43px Arial";
  ctx.strokeText("SUPER MONKEY RUNNER", 450, 185);
  ctx.fillText("SUPER MONKEY RUNNER", 450, 185);

  ctx.font = "bold 22px Arial";
  ctx.fillStyle = "#fff";
  ctx.fillText("200 LEVELS • RUN • JUMP • COLLECT", 450, 385);
  ctx.textAlign = "left";
}

function drawObstacle(o) {
  ctx.fillStyle="#995522";
  ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.strokeStyle="#512c12";
  ctx.lineWidth=5;
  ctx.strokeRect(o.x,o.y,o.w,o.h);
  ctx.beginPath();
  ctx.moveTo(o.x,o.y+o.h/2);
  ctx.lineTo(o.x+o.w,o.y+o.h/2);
  ctx.stroke();
}

function drawTreasure(t) {
  ctx.font="30px Arial";
  ctx.fillText(t.type==="coin"?"🪙":"🍌",t.x,t.y);
}

function spawnObjects(dt) {
  spawnTimer+=dt;
  coinTimer+=dt;

  if(spawnTimer>Math.max(0.75,1.7/difficulty())) {
    obstacles.push({
      x:930,y:groundY-48,w:48,h:48
    });
    spawnTimer=0;
  }

  if(coinTimer>1.15) {
    treasures.push({
      x:930,
      y:220+Math.random()*100,
      type:Math.random()<0.55?"coin":"banana"
    });
    coinTimer=0;
  }
}

function hit(a,b) {
  return a.x+15<b.x+b.w &&
    a.x+a.w-15>b.x &&
    a.y+12<b.y+b.h &&
    a.y+a.h-10>b.y;
}

function nextLevel() {
  if(level>=200) {
    running=false;
    gameOver=true;
    document.getElementById("message").textContent =
      "🏆 CHAMPION! You completed all 200 levels!";
    draw();
    return;
  }

  level++;
  timeLeft=levelDuration(level);
  obstacles=[];
  treasures=[];
  spawnTimer=0;

  document.getElementById("message").textContent =
    "🎉 Level "+level+" started!";

  updateInfo();
}

function endGame() {
  running=false;
  gameOver=true;
  document.getElementById("message").textContent =
    "GAME OVER! Score: "+score+" | Press PLAY";
  draw();
}

function update(dt) {
  animationTime+=dt*1000;

  if(invulnerable>0) invulnerable-=dt*1000;

  timeLeft-=dt;

  if(timeLeft<=0) {
    nextLevel();
    return;
  }

  score+=Math.floor(dt*10);

  player.vy+=0.75;
  player.y+=player.vy;

  if(player.y+player.h>=groundY) {
    player.y=groundY-player.h;
    player.vy=0;
    player.ground=true;
  }

  spawnObjects(dt);

  let speed=300*difficulty();

  obstacles.forEach(o=>o.x-=speed*dt);
  treasures.forEach(t=>t.x-=speed*dt);

  obstacles=obstacles.filter(o=>o.x+o.w>0);
  treasures=treasures.filter(t=>t.x+35>0);

  for(let i=0;i<obstacles.length;i++) {
    if(hit(player,obstacles[i])&&invulnerable<=0) {
      lives--;
      invulnerable=1500;
      obstacles.splice(i,1);

      if(lives<=0) {
        endGame();
        return;
      }
      break;
    }
  }

  for(let i=treasures.length-1;i>=0;i--) {
    let t=treasures[i];
    let box={x:t.x,y:t.y-25,w:30,h:30};

    if(hit(player,box)) {
      if(t.type==="coin") coins++;
      else score+=50;
      treasures.splice(i,1);
    }
  }

  updateInfo();
}

function draw() {
  if (!running && !gameOver) {
    drawHomeScreen();
    return;
  }

  drawBackground();
  obstacles.forEach(drawObstacle);
  treasures.forEach(drawTreasure);
  drawMonkey();

  if(paused || gameOver) {
    ctx.fillStyle="rgba(0,0,0,.5)";
    ctx.fillRect(0,0,900,450);
    ctx.fillStyle="white";
    ctx.font="bold 48px Arial";
    ctx.textAlign="center";
    ctx.fillText(paused?"PAUSED":
      (level>=200?"CHAMPION!":"GAME OVER"),450,220);
    ctx.textAlign="left";
  }
}

function loop(timestamp) {
  if(!running||paused||gameOver) return;

  if(!lastTime) lastTime=timestamp;

  let dt=Math.min((timestamp-lastTime)/1000,0.04);
  lastTime=timestamp;

  update(dt);
  draw();

  if(running&&!paused&&!gameOver) {
    requestAnimationFrame(loop);
  }
}

draw();
updateInfo();
</script>

</body>
</html>
