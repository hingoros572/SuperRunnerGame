
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Monkey Runner</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101b36;color:white;
 font-family:Arial,sans-serif;text-align:center;
 overflow:hidden;touch-action:manipulation
}
h1{font-size:25px;margin:10px 0;color:#ffd43b}
#info{
 display:flex;justify-content:space-around;align-items:center;
 flex-wrap:wrap;gap:7px;padding:8px;font-size:14px;font-weight:bold
}
.stat{background:#26385f;border-radius:10px;padding:8px 10px}
#game{
 display:block;width:100%;max-width:950px;height:auto;
 margin:5px auto;background:#83dafa;border:3px solid white;
 border-radius:12px;touch-action:none
}
#controls{padding:7px}
button{
 border:0;border-radius:12px;padding:12px 22px;
 font-size:17px;font-weight:bold;margin:4px;
 background:#ffca28;color:#222
}
#jump{background:#24d46b;color:#071b10}
#message{font-size:15px;min-height:22px;color:#ffe082}
#bar{height:10px;background:#34466e;margin:5px 12px;border-radius:10px;overflow:hidden}
#progress{height:100%;width:0%;background:#31df75}
.small{font-size:12px;color:#d8e4ff}
</style>
</head>
<body>

<h1>🐵 SUPER MONKEY RUNNER 🐵</h1>

<div id="info">
 <div class="stat" id="level">Level: 1 / 200</div>
 <div class="stat" id="time">Time: 04:00</div>
 <div class="stat" id="lives">❤️❤️❤️</div>
 <div class="stat" id="score">Score: 0</div>
 <div class="stat" id="coins">🪙 0</div>
</div>

<div id="bar"><div id="progress"></div></div>

<canvas id="game" width="900" height="500"></canvas>

<div id="message">Play dabayein aur bandar ko daudayein!</div>

<div id="controls">
 <button id="start">▶ PLAY</button>
 <button id="jump">⬆ JUMP</button>
 <button id="pause">⏸ PAUSE</button>
 <button id="restart">↻ RESTART</button>
</div>
<div class="small">Mobile: Screen ya JUMP button dabakar jump karein</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const levelText=document.getElementById("level");
const timeText=document.getElementById("time");
const livesText=document.getElementById("lives");
const scoreText=document.getElementById("score");
const coinsText=document.getElementById("coins");
const message=document.getElementById("message");
const progress=document.getElementById("progress");

const monkeyImage=new Image();
monkeyImage.src="monkey.png";
let monkeyLoaded=false;
monkeyImage.onload=()=>{monkeyLoaded=true;};
monkeyImage.onerror=()=>{monkeyLoaded=false;};

let level=1,score=0,coins=0,lives=3;
let running=false,paused=false,gameOver=false;
let levelStart=0,levelDuration=240000;
let lastFrame=0,spawnTimer=0,collectTimer=0;
let obstacles=[],treasures=[];
let ground=410;
let speed=5;
let invulnerable=0;

const player={
 x:110,y:300,w:95,h:100,
 vy:0,onGround:false
};

function getLevelDuration(){
 if(level<=50)return 4*60*1000;
 if(level<=100)return 5*60*1000;
 if(level<=150)return 6*60*1000;
 return 8*60*1000;
}

function formatTime(ms){
 let seconds=Math.max(0,Math.ceil(ms/1000));
 let min=Math.floor(seconds/60);
 let sec=seconds%60;
 return String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function difficulty(){
 if(level<=50)return "NORMAL";
 if(level<=100)return "MEDIUM";
 if(level<=150)return "HARD";
 return "VERY HARD";
}

function updateInfo(){
 levelText.textContent="Level: "+level+" / 200 ("+difficulty()+")";
 livesText.textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
 scoreText.textContent="Score: "+score;
 coinsText.textContent="🪙 "+coins;
}

function drawBackground(){
 let sky=ctx.createLinearGradient(0,0,0,500);
 sky.addColorStop(0,"#65c9f4");
 sky.addColorStop(1,"#d5f5ff");
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,900,500);

 // Sun
 ctx.fillStyle="#ffe34d";
 ctx.beginPath();ctx.arc(770,75,43,0,Math.PI*2);ctx.fill();

 // Clouds
 ctx.fillStyle="white";
 drawCloud(130,90);drawCloud(420,65);drawCloud(650,155);

 // Hills
 ctx.fillStyle="#66c66c";
 ctx.beginPath();
 ctx.moveTo(0,350);ctx.quadraticCurveTo(180,210,350,350);
 ctx.quadraticCurveTo(550,230,730,350);
 ctx.quadraticCurveTo(830,280,900,340);
 ctx.lineTo(900,500);ctx.lineTo(0,500);ctx.fill();

 // Ground
 ctx.fillStyle="#9a6034";
 ctx.fillRect(0,ground,900,90);
 ctx.fillStyle="#39b84a";
 ctx.fillRect(0,ground,900,13);
 ctx.fillStyle="#d5a05b";
 for(let i=0;i<900;i+=65){
  ctx.fillRect((i-(score*2)%65),ground+35,30,5);
 }
}

function drawCloud(x,y){
 ctx.beginPath();
 ctx.arc(x,y,23,0,Math.PI*2);
 ctx.arc(x+25,y-12,28,0,Math.PI*2);
 ctx.arc(x+53,y,22,0,Math.PI*2);
 ctx.fill();
}

function drawMonkey(){
 if(invulnerable>0 && Math.floor(invulnerable/7)%2===0)return;

 if(monkeyLoaded){
  ctx.drawImage(monkeyImage,player.x,player.y,player.w,player.h);
 }else{
  ctx.font="75px Arial";
  ctx.fillText("🐵",player.x,player.y+75);
 }
}

function drawObstacle(o){
 ctx.fillStyle="#8b451f";
 ctx.fillRect(o.x,o.y,o.w,o.h);
 ctx.fillStyle="#c47a36";
 ctx.fillRect(o.x+6,o.y+7,o.w-12,10);
 ctx.strokeStyle="#4c2815";
 ctx.lineWidth=4;
 ctx.strokeRect(o.x,o.y,o.w,o.h);
 ctx.fillStyle="#f1c27d";
 ctx.fillRect(o.x+12,o.y+25,5,5);
}

function drawTreasure(t){
 ctx.font="32px Arial";
 ctx.fillText(t.type==="coin"?"🪙":"🍌",t.x,t.y);
}

function draw(){
 drawBackground();
 obstacles.forEach(drawObstacle);
 treasures.forEach(drawTreasure);
 drawMonkey();

 if(!running && !gameOver && !paused){
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.fillRect(0,0,900,500);
  ctx.fillStyle="white";
  ctx.font="bold 40px Arial";
  ctx.textAlign="center";
  ctx.fillText("SUPER MONKEY RUNNER",450,220);
  ctx.font="24px Arial";
  ctx.fillText("PRESS PLAY TO START",450,270);
  ctx.textAlign="left";
 }

 if(paused){
  ctx.fillStyle="rgba(0,0,0,.5)";
  ctx.fillRect(0,0,900,500);
  ctx.fillStyle="white";
  ctx.font="bold 50px Arial";
  ctx.textAlign="center";
  ctx.fillText("PAUSED",450,260);
  ctx.textAlign="left";
 }

 if(gameOver){
  ctx.fillStyle="rgba(0,0,0,.65)";
  ctx.fillRect(0,0,900,500);
  ctx.fillStyle="#ffdf45";
  ctx.font="bold 50px Arial";
  ctx.textAlign="center";
  ctx.fillText(level===200?"CHAMPION!":"GAME OVER",450,220);
  ctx.fillStyle="white";
  ctx.font="25px Arial";
  ctx.fillText("Score: "+score+"   Coins: "+coins,450,270);
  ctx.fillText("RESTART dabayein",450,320);
  ctx.textAlign="left";
 }
}

function jump(){
 if(!running || paused || gameOver)return;
 if(player.onGround){
  player.vy=-16;
  player.onGround=false;
 }
}

function startGame(){
 if(running)return;
 if(gameOver)return;
 paused=false;
 running=true;
 levelStart=performance.now();
 levelDuration=getLevelDuration();
 lastFrame=performance.now();
 message.textContent="Run! Obstacles se bachein!";
 requestAnimationFrame(loop);
}

function nextLevel(){
 running=false;
 if(level>=200){
  gameOver=true;
  message.textContent="🏆 MUBARAK! Aap Champion ban gaye!";
  draw();
  return;
 }
 level++;
 obstacles=[];
 treasures=[];
 spawnTimer=0;
 collectTimer=0;
 player.y=ground-player.h;
 player.vy=0;
 player.onGround=true;
 invulnerable=0;
 levelDuration=getLevelDuration();
 levelStart=performance.now();
 lastFrame=performance.now();
 updateInfo();
 message.textContent="🎉 Level "+level+" shuru!";
 running=true;
 requestAnimationFrame(loop);
}

function loseLife(){
 if(invulnerable>0)return;
 lives--;
 invulnerable=100;
 player.vy=-9;
 updateInfo();
 if(lives<=0){
  lives=0;
  running=false;
  gameOver=true;
  message.textContent="Game Over! Restart karein.";
 }
}

function completeLevel(){
 running=false;
 if(level===200){
  gameOver=true;
  message.textContent="🏆 Aapne 200 levels complete kar liye!";
  draw();
  return;
 }
 message.textContent="Level "+level+" complete! Agla level...";
 draw();
 setTimeout(nextLevel,1800);
}

function loop(now){
 if(!running || paused || gameOver)return;

 let dt=Math.min((now-lastFrame)/16.67,2);
 lastFrame=now;

 let elapsed=now-levelStart;
 let remaining=levelDuration-elapsed;

 timeText.textContent="Time: "+formatTime(remaining);
 progress.style.width=Math.min(100,elapsed/levelDuration*100)+"%";

 if(remaining<=0){
  timeText.textContent="Time: 00:00";
  completeLevel();
  return;
 }

 let levelSpeed=level<=50?5:level<=100?6:level<=150?7:8;
 speed=levelSpeed;

 // Player physics
 player.vy+=0.75*dt;
 player.y+=player.vy*dt;
 if(player.y+player.h>=ground){
  player.y=ground-player.h;
  player.vy=0;
  player.onGround=true;
 }

 if(invulnerable>0)invulnerable-=dt;

 // Obstacles
 spawnTimer+=dt;
 let spawnGap=level<=50?100:level<=100?82:level<=150?68:58;
 if(spawnTimer>spawnGap){
  spawnTimer=0;
  let h=45+Math.random()*25;
  obstacles.push({x:920,y:ground-h,w:35+Math.random()*15,h:h});
 }

 obstacles.forEach(o=>o.x-=speed*dt);
 obstacles=obstacles.filter(o=>o.x+o.w>0);

 // Coins and bananas
 collectTimer+=dt;
 if(collectTimer>75){
  collectTimer=0;
  let type=Math.random()<0.7?"coin":"banana";
  treasures.push({x:930,y:ground-100-Math.random()*90,type});
 }
 treasures.forEach(t=>t.x-=speed*dt);
 treasures=treasures.filter(t=>t.x>-40);

 // Collision
 let px=player.x+18,py=player.y+18;
 let pw=player.w-35,ph=player.h-25;

 obstacles.forEach(o=>{
  if(px<o.x+o.w && px+pw>o.x &&
     py<o.y+o.h && py+ph>o.y){
   if(invulnerable<=0)loseLife();
  }
 });

 treasures=treasures.filter(t=>{
  let hit=px<t.x+25 && px+pw>t.x-10 &&
          py<t.y+25 && py+ph>t.y-25;
  if(hit){
   if(t.type==="coin"){coins++;score+=10;}
   else{score+=20;}
   updateInfo();
   return false;
  }
  return true;
 });

 score+=Math.max(1,Math.floor(dt));
 updateInfo();

 if(gameOver){
  draw();
  return;
 }

 draw();
 requestAnimationFrame(loop);
}

function restartAll(){
 level=1;score=0;coins=0;lives=3;
 running=false;paused=false;gameOver=false;
 obstacles=[];treasures=[];
 spawnTimer=0;collectTimer=0;
 player.y=ground-player.h;
 player.vy=0;player.onGround=true;
 invulnerable=0;
 levelDuration=getLevelDuration();
 timeText.textContent="Time: 04:00";
 progress.style.width="0%";
 message.textContent="Play dabayein aur bandar ko daudayein!";
 updateInfo();
 draw();
}

document.getElementById("start").addEventListener("click",startGame);
document.getElementById("jump").addEventListener("click",jump);
document.getElementById("restart").addEventListener("click",restartAll);

document.getElementById("pause").addEventListener("click",()=>{
 if(running){
  paused=true;
  running=false;
  message.textContent="Game paused";
  draw();
 }else if(paused && !gameOver){
  paused=false;
  running=true;
  lastFrame=performance.now();
  levelStart=lastFrame-(levelDuration-
    Math.max(0,parseTime(timeText.textContent)));
  requestAnimationFrame(loop);
 }
});

function parseTime(text){
 let parts=text.split(":").pop().trim().split(":");
 return (Number(parts[0])*60+Number(parts[1]))*1000;
}

canvas.addEventListener("pointerdown",jump);
document.addEventListener("keydown",e=>{
 if(e.code==="Space" || e.code==="ArrowUp"){
  e.preventDefault();jump();
 }
});

player.y=ground-player.h;
player.onGround=true;
updateInfo();
draw();
</script>
</body>
</html>
