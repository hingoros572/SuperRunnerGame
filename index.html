
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Monkey Runner</title>
<meta name="theme-color" content="#101b35">
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101b35;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
}
h1{margin:12px 0;color:#ffd43b}
#info{
 display:flex;
 justify-content:center;
 gap:12px;
 flex-wrap:wrap;
 padding:8px;
 font-weight:bold;
}
canvas{
 width:100%;
 display:block;
 background:#8edcff;
 border:3px solid white;
 border-radius:10px;
 touch-action:manipulation;
}
#gameBox{
 position:relative;
 width:100%;
 max-width:850px;
 margin:auto;
}
#panel{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#0009;
 padding:15px;
}
#message{
 background:#15284a;
 padding:22px;
 border:3px solid #ffd43b;
 border-radius:16px;
 max-width:90%;
 width:380px;
}
#message h2{color:#ffd43b}
button{
 background:#ffd43b;
 color:#17213a;
 border:0;
 border-radius:10px;
 padding:13px 22px;
 font-size:18px;
 font-weight:bold;
 margin:8px;
}
#hint{padding:10px;color:#ddd}
</style>
</head>

<body>

<h1>🐵 SUPER MONKEY RUNNER</h1>

<div id="info">
 <span id="level">Level: 1</span>
 <span id="difficulty">NORMAL</span>
 <span id="score">Score: 0</span>
 <span id="coins">Coins: 0</span>
 <span id="lives">❤️❤️❤️</span>
</div>

<div id="gameBox">
 <canvas id="game" width="800" height="400"></canvas>

 <div id="panel">
  <div id="message">
   <h2>🐵 Super Monkey Runner</h2>
   <p>200 Levels Challenge!</p>
   <p>❤️ 3 Lives System</p>
   <p>Jump karo aur coins collect karo!</p>
   <button onclick="startGame()">PLAY GAME</button>
  </div>
 </div>
</div>

<div id="hint">
 Mobile: Screen par tap karke jump karein.<br>
 Computer: Space ya Up Arrow dabayein.
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const panel=document.getElementById("panel");
const message=document.getElementById("message");

const levelText=document.getElementById("level");
const difficultyText=document.getElementById("difficulty");
const scoreText=document.getElementById("score");
const coinsText=document.getElementById("coins");
const livesText=document.getElementById("lives");

let level=1;
let score=0;
let coins=0;
let distance=0;
let running=false;
let frame=0;
let speed=5;

let lives=3;
let invulnerable=0;

let obstacles=[];
let treasures=[];

const monkey={
 x:100,
 y:280,
 w:55,
 h:65,
 vy:0,
 ground:280,
 jumping:false
};

function difficultyName(){
 if(level<=50)return "NORMAL";
 if(level<=100)return "MEDIUM";
 if(level<=150)return "HARD";
 return "VERY HARD";
}

function levelTarget(){
 return 700+level*15;
}

function gameSpeed(){
 if(level<=50)return 5+level*.025;
 if(level<=100)return 6.25+(level-50)*.045;
 if(level<=150)return 8.5+(level-100)*.065;
 return 12+(level-150)*.09;
}

function updateInfo(){
 levelText.textContent="Level: "+level+"/200";
 difficultyText.textContent=difficultyName();
 scoreText.textContent="Score: "+score;
 coinsText.textContent="Coins: "+coins;
 livesText.textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
}

function startGame(){
 score=0;
 distance=0;
 frame=0;
 obstacles=[];
 treasures=[];
 speed=gameSpeed();

 lives=3;
 invulnerable=0;

 monkey.y=monkey.ground;
 monkey.vy=0;
 monkey.jumping=false;

 running=true;
 panel.style.display="none";
 updateInfo();
}

function jump(){
 if(!running)return;

 if(!monkey.jumping){
  monkey.vy=-14;
  monkey.jumping=true;
 }
}

canvas.addEventListener("pointerdown",jump);

document.addEventListener("keydown",e=>{
 if(e.code==="Space"||e.code==="ArrowUp"){
  e.preventDefault();
  jump();
 }
});

function drawBackground(){
 let sky=ctx.createLinearGradient(0,0,0,400);
 sky.addColorStop(0,"#63c9ff");
 sky.addColorStop(1,"#d5f7ff");

 ctx.fillStyle=sky;
 ctx.fillRect(0,0,800,400);

 // Sun
 ctx.fillStyle="#ffdf55";
 ctx.beginPath();
 ctx.arc(690,65,35,0,Math.PI*2);
 ctx.fill();

 // Clouds
 ctx.fillStyle="white";

 for(let i=0;i<4;i++){
  let x=(i*230-frame*.3)%950;
  if(x<-100)x+=950;

  ctx.beginPath();
  ctx.arc(x,85,22,0,Math.PI*2);
  ctx.arc(x+25,75,28,0,Math.PI*2);
  ctx.arc(x+55,87,20,0,Math.PI*2);
  ctx.fill();
 }

 // Hills
 ctx.fillStyle="#60bd62";
 ctx.beginPath();
 ctx.moveTo(0,280);

 for(let x=0;x<=800;x+=100){
  ctx.quadraticCurveTo(x+50,210,x+100,280);
 }

 ctx.lineTo(800,400);
 ctx.lineTo(0,400);
 ctx.fill();

 // Ground
 ctx.fillStyle="#348a3c";
 ctx.fillRect(0,345,800,55);

 ctx.fillStyle="#e7c47b";
 ctx.fillRect(0,360,800,40);

 // Road marks
 ctx.fillStyle="white";

 for(let i=0;i<10;i++){
  let x=(i*110-frame*speed)%900;
  if(x<0)x+=900;
  ctx.fillRect(x,380,45,5);
 }
}

function drawMonkey(){
 let x=monkey.x;
 let y=monkey.y;

 ctx.save();

 // Hit hone par blinking
 if(invulnerable>0 && Math.floor(frame/5)%2===0){
  ctx.globalAlpha=.35;
 }

 // Tail
 ctx.strokeStyle="#793d18";
 ctx.lineWidth=9;
 ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(x+12,y+37);
 ctx.quadraticCurveTo(x-28,y+5,x-17,y+25);
 ctx.stroke();

 // Body
 ctx.fillStyle="#a65a25";
 ctx.beginPath();
 ctx.ellipse(x+27,y+42,20,25,0,0,Math.PI*2);
 ctx.fill();

 // Belly
 ctx.fillStyle="#f3c58a";
 ctx.beginPath();
 ctx.ellipse(x+28,y+45,12,17,0,0,Math.PI*2);
 ctx.fill();

 // Ears
 ctx.fillStyle="#793d18";
 ctx.beginPath();
 ctx.arc(x+5,y+10,11,0,Math.PI*2);
 ctx.arc(x+49,y+10,11,0,Math.PI*2);
 ctx.fill();

 // Head
 ctx.fillStyle="#a65a25";
 ctx.beginPath();
 ctx.arc(x+27,y+15,25,0,Math.PI*2);
 ctx.fill();

 // Face
 ctx.fillStyle="#f3c58a";
 ctx.beginPath();
 ctx.ellipse(x+27,y+22,17,12,0,0,Math.PI*2);
 ctx.fill();

 // Eyes
 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(x+18,y+12,5,0,Math.PI*2);
 ctx.arc(x+36,y+12,5,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="black";
 ctx.beginPath();
 ctx.arc(x+19,y+12,2,0,Math.PI*2);
 ctx.arc(x+37,y+12,2,0,Math.PI*2);
 ctx.fill();

 // Nose
 ctx.fillStyle="#5a2815";
 ctx.beginPath();
 ctx.arc(x+27,y+21,3,0,Math.PI*2);
 ctx.fill();

 // Smile
 ctx.strokeStyle="#5a2815";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(x+27,y+22,8,.2,2.9);
 ctx.stroke();

 // Arms
 ctx.strokeStyle="#793d18";
 ctx.lineWidth=8;
 ctx.beginPath();
 ctx.moveTo(x+12,y+37);
 ctx.lineTo(x-1,y+49);
 ctx.moveTo(x+43,y+37);
 ctx.lineTo(x+55,y+48);
 ctx.stroke();

 // Legs
 let swing=Math.sin(frame*.3)*7;
 ctx.strokeStyle="#793d18";
 ctx.lineWidth=9;
 ctx.beginPath();
 ctx.moveTo(x+18,y+60);
 ctx.lineTo(x+13+swing,y+72);
 ctx.moveTo(x+37,y+60);
 ctx.lineTo(x+42-swing,y+72);
 ctx.stroke();

 ctx.restore();
}

function spawnItems(){
 if(frame%90===0){
  obstacles.push({
   x:820,
   y:320,
   w:38,
   h:40
  });
 }

 if(frame%55===0){
  treasures.push({
   x:820,
   y:230+Math.random()*80,
   type:Math.random()<.25?"banana":"coin",
   taken:false
  });
 }
}

function drawItems(){
 obstacles.forEach(o=>{
  ctx.fillStyle="#8b4b20";
  ctx.fillRect(o.x,o.y,o.w,o.h);

  ctx.strokeStyle="#4e2914";
  ctx.lineWidth=4;
  ctx.strokeRect(o.x,o.y,o.w,o.h);

  ctx.fillStyle="#d69a51";
  ctx.fillRect(o.x+5,o.y+8,o.w-10,5);
 });

 treasures.forEach(t=>{
  if(t.taken)return;

  if(t.type==="coin"){
   ctx.fillStyle="#ffd700";
   ctx.beginPath();
   ctx.arc(t.x,t.y,12,0,Math.PI*2);
   ctx.fill();

   ctx.strokeStyle="#b77b00";
   ctx.lineWidth=3;
   ctx.stroke();
  }else{
   ctx.font="28px Arial";
   ctx.fillText("🍌",t.x-14,t.y+10);
  }
 });
}

function collision(a,b){
 return a.x<b.x+b.w &&
 a.x+a.w>b.x &&
 a.y<b.y+b.h &&
 a.y+a.h>b.y;
}

function loseLife(){
 if(invulnerable>0)return;

 lives--;
 invulnerable=100;

 // Bandar ko thoda peeche aur upar bachao
 monkey.vy=-7;
 monkey.jumping=true;

 updateInfo();

 if(lives<=0){
  endGame();
 }
}

function endGame(){
 running=false;
 panel.style.display="flex";

 message.innerHTML=
 "<h2>😢 GAME OVER</h2>"+
 "<p>Level: "+level+"</p>"+
 "<p>Score: "+score+"</p>"+
 "<p>Coins: "+coins+"</p>"+
 "<p>Dobara koshish karein!</p>"+
 "<button onclick='startGame()'>TRY AGAIN</button>";
}

function completeLevel(){
 running=false;
 panel.style.display="flex";

 if(level===200){
  message.innerHTML=
  "<h2>🏆 YOU ARE THE CHAMPION!</h2>"+
  "<p>Congratulations!</p>"+
  "<p>Aapne saare 200 levels complete kar liye!</p>"+
  "<p>Total Coins: "+coins+"</p>"+
  "<button onclick='restartAll()'>PLAY AGAIN</button>";
 }else{
  message.innerHTML=
  "<h2>🎉 LEVEL COMPLETE!</h2>"+
  "<p>Level "+level+" complete ho gaya!</p>"+
  "<p>Score: "+score+"</p>"+
  "<p>Coins: "+coins+"</p>"+
  "<p>Agla level shuru karne ke liye button dabayein.</p>"+
  "<button onclick='nextLevel()'>NEXT LEVEL</button>";
 }
}

function nextLevel(){
 level++;
 startGame();
}

function restartAll(){
 level=1;
 coins=0;
 startGame();
}

function update(){
 if(!running)return;

 frame++;
 speed=gameSpeed();
 distance+=speed;
 score++;

 if(invulnerable>0){
  invulnerable--;
 }

 // Monkey movement
 monkey.y+=monkey.vy;
 monkey.vy+=.7;

 if(monkey.y>=monkey.ground){
  monkey.y=monkey.ground;
  monkey.vy=0;
  monkey.jumping=false;
 }

 spawnItems();

 // Obstacles
 obstacles.forEach(o=>{
  o.x-=speed;

  if(invulnerable<=0 && collision(
   {x:monkey.x+8,y:monkey.y+10,w:38,h:58},
   o
  )){
   loseLife();
  }
 });

 if(!running)return;

 // Coins and bananas
 treasures.forEach(t=>{
  t.x-=speed;

  if(!t.taken && collision(
   {x:monkey.x,y:monkey.y,w:55,h:65},
   {x:t.x-12,y:t.y-12,w:24,h:24}
  )){
   t.taken=true;

   if(t.type==="coin"){
    coins++;
    score+=10;
   }else{
    score+=50;
   }
  }
 });

 obstacles=obstacles.filter(o=>o.x>-60);
 treasures=treasures.filter(t=>t.x>-60&&!t.taken);

 updateInfo();

 if(distance>=levelTarget()){
  completeLevel();
 }
}

function draw(){
 drawBackground();
 drawItems();
 drawMonkey();

 ctx.fillStyle="#17213a";
 ctx.font="bold 18px Arial";

 ctx.fillText(
  "Target: "+Math.floor(distance)+" / "+levelTarget(),
  20,30
 );
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

updateInfo();
draw();
loop();

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("service-worker.js")
  .catch(err=>console.log("Service Worker error",err));
 });
}
</script>

</body>
</html>
